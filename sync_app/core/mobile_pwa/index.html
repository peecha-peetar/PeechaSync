<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>دوربین پیچا</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="theme-color" content="#4f46e5" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="wrap">
  <header>
    <h1>📷 دوربین پیچا</h1>
    <p>عکس بگیرید — خودکار به برنامه‌ی پیچا فرستاده می‌شه</p>
    <div id="connStatus" class="status bad">در حال بررسیِ اتصال...</div>
  </header>

  <label class="capture-btn">
    📸 گرفتن / انتخابِ عکس
    <input id="captureInput" type="file" accept="image/*" capture="environment" style="display:none" />
  </label>

  <div class="queue-header">
    <span id="queueCount">صف خالیه</span>
    <button id="refreshBtn" class="refresh-btn">🔄 بررسیِ دوباره</button>
  </div>
  <div id="queueList"></div>
</div>

<div id="editScreen" class="edit-overlay">
  <div class="edit-panel">
    <p class="edit-hint">عکس رو بکشید تا جابه‌جا بشه — با اسلایدر بزرگ‌نمایی کنید</p>
    <div class="edit-canvas-wrap">
      <canvas id="editCanvas"></canvas>
    </div>
    <div class="edit-zoom-row">
      <span>🔍</span>
      <input type="range" id="editZoom" />
    </div>
    <div id="editPresets" class="edit-presets"></div>
    <label class="bg-remove-row">
      <input type="checkbox" id="editBgRemove" />
      <span>🧹 حذفِ خودکارِ پس‌زمینه (رویِ همینِ گوشی — اولین بار چند ثانیه طول می‌کشه)</span>
    </label>
    <div class="edit-actions">
      <button id="editCancelBtn" class="edit-btn cancel">لغو</button>
      <button id="editConfirmBtn" class="edit-btn confirm">✅ ادامه</button>
    </div>
  </div>
</div>

<script src="./vendor/ort/ort.wasm.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
